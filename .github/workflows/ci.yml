name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["LICENSE", "NOTICE", ".gitignore"]
  pull_request:
    paths-ignore: ["LICENSE", "NOTICE", ".gitignore"]

# Markdown is not path-ignored: AGENTS.md is a rendered artifact, and a hand-edit
# to it must reach the drift check rather than skip CI.
jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash
  # of their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # The permissions block is scoped to this job alone: opening the issue needs
  # issues:write, which no other job here is granted.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  # Pure-Python wheel: no ROS, no colcon. uv runs lint + the pytest suite, and a
  # guard asserts the package imports with no rclpy on the path.
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Test
        run: uv run --extra dev pytest

      - name: Assert ROS-free import
        run: uv run python -c "import fm_tools.tui; import sys; assert 'rclpy' not in sys.modules"
